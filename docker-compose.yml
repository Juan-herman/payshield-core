version: '3.8'

services:
  reverse-proxy:
    image: nginx:alpine
    container_name: payshield-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - dmz_net
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: ./app
    container_name: payshield-api
    env_file:
      - .env
    networks:
      - dmz_net
      - internal_net
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: payshield-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal_net
    restart: unless-stopped

networks:
  dmz_net:
    driver: bridge
  internal_net:
    driver: bridge
    internal: true

volumes:
  pgdata: 
